<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <style>
    .h{font-size:16px;font-weight:700;fill:#FFFFFF}
    .t{font-size:13px;font-weight:700;fill:#0B2545}
    .b{font-size:10.8px;fill:#1E2B37}
    .s{font-size:10px;fill:#33475B}
    .w{font-size:10.5px;fill:#FFFFFF;font-weight:700}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0B2545"/></marker>
    <marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#13838F"/></marker>
  </defs>
  <rect width="1100" height="560" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1100" height="44" fill="#0B2545"/>
  <text x="24" y="28" class="h">Problem 5 &#183; Allocation across clusters happens at three levels &#8212; not by moving power between cities</text>

  <!-- LEVEL 1 -->
  <rect x="16" y="58" width="1068" height="200" rx="10" fill="#F2F5F8" stroke="#C9D3DD"/>
  <text x="32" y="82" class="t">Level 1 &#183; Portfolio (once a day, before the IEX window)</text>
  <text x="32" y="100" class="s">Central optimiser shares common resources; each cluster then solves its own dispatch (decomposition = scales to more cities)</text>

  <rect x="40" y="118" width="210" height="120" rx="8" fill="#FFFFFF" stroke="#0B2545"/>
  <text x="54" y="140" class="t" font-size="12">Shared resources</text>
  <text x="54" y="160" class="b">&#8226; 35% renewable via open-access</text>
  <text x="54" y="174" class="b">   contracts (solar + wind)</text>
  <text x="54" y="190" class="b">&#8226; IEX DAM / RTM budget</text>
  <text x="54" y="206" class="b">&#8226; RE banking (monthly, state rules)</text>
  <text x="54" y="222" class="b">&#8226; network-wide 5% reserve</text>

  <rect x="290" y="128" width="170" height="100" rx="8" fill="#0B2545"/>
  <text x="375" y="160" text-anchor="middle" class="w" font-size="12">Portfolio optimiser</text>
  <text x="375" y="180" text-anchor="middle" font-size="10.5" fill="#B9D7EA">master problem</text>
  <text x="375" y="196" text-anchor="middle" font-size="10.5" fill="#B9D7EA">(Benders / progressive</text>
  <text x="375" y="210" text-anchor="middle" font-size="10.5" fill="#B9D7EA">hedging if it grows)</text>
  <line x1="250" y1="178" x2="288" y2="178" stroke="#0B2545" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- five cluster chips -->
  <g>
    <rect x="520" y="116" width="104" height="58" rx="8" fill="#13838F"/>
    <text x="572" y="138" text-anchor="middle" class="w">Delhi NCR</text><text x="572" y="155" text-anchor="middle" font-size="10" fill="#D6F0F2">heat peaks</text><text x="572" y="167" text-anchor="middle" font-size="10" fill="#D6F0F2">28% demand</text>
    <rect x="634" y="116" width="104" height="58" rx="8" fill="#13838F"/>
    <text x="686" y="138" text-anchor="middle" class="w">Mumbai MMR</text><text x="686" y="155" text-anchor="middle" font-size="10" fill="#D6F0F2">high rents</text><text x="686" y="167" text-anchor="middle" font-size="10" fill="#D6F0F2">22% demand</text>
    <rect x="748" y="116" width="104" height="58" rx="8" fill="#13838F"/>
    <text x="800" y="138" text-anchor="middle" class="w">Bengaluru</text><text x="800" y="155" text-anchor="middle" font-size="10" fill="#D6F0F2">2W swap dense</text><text x="800" y="167" text-anchor="middle" font-size="10" fill="#D6F0F2">20% demand</text>
    <rect x="862" y="116" width="104" height="58" rx="8" fill="#13838F"/>
    <text x="914" y="138" text-anchor="middle" class="w">Hyderabad</text><text x="914" y="155" text-anchor="middle" font-size="10" fill="#D6F0F2">solar surplus</text><text x="914" y="167" text-anchor="middle" font-size="10" fill="#D6F0F2">16% demand</text>
    <rect x="976" y="116" width="96" height="58" rx="8" fill="#13838F"/>
    <text x="1024" y="138" text-anchor="middle" class="w">Chennai</text><text x="1024" y="155" text-anchor="middle" font-size="10" fill="#D6F0F2">wind swings</text><text x="1024" y="167" text-anchor="middle" font-size="10" fill="#D6F0F2">14% demand</text>
  </g>
  <path d="M460,178 L500,178 L500,145 L518,145" fill="none" stroke="#0B2545" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="520" y="196" class="b">Each cluster gets: RE share, IEX bid volume per 15-min block, storage plan, price plan.</text>
  <text x="520" y="214" class="b">Surplus RE in one cluster &#8594; bank it or cut that cluster's IEX buying (never curtail first).</text>
  <text x="520" y="232" class="b" font-weight="700" fill="#C8553D">Physical power cannot be shipped Delhi &#8594; Mumbai; only contracts and schedules move.</text>

  <!-- LEVEL 2 -->
  <rect x="16" y="270" width="640" height="276" rx="10" fill="#EEF6F7" stroke="#13838F"/>
  <text x="32" y="294" class="t">Level 2 &#183; Pack moves inside a metro (hourly to daily)</text>
  <text x="32" y="312" class="s">Min-cost flow with travel time &#8212; like bike-share trucks moving bikes before the morning rush</text>
  <!-- station network -->
  <g>
    <circle cx="100" cy="410" r="38" fill="#FFFFFF" stroke="#13838F" stroke-width="2"/>
    <text x="100" y="406" text-anchor="middle" class="b" font-weight="700">Hub A</text><text x="100" y="420" text-anchor="middle" class="s">+38 spare</text>
    <circle cx="300" cy="360" r="38" fill="#FFFFFF" stroke="#C8553D" stroke-width="2"/>
    <text x="300" y="356" text-anchor="middle" class="b" font-weight="700">Hub B</text><text x="300" y="370" text-anchor="middle" class="s" fill="#C8553D">&#8722;25 at 18:00</text>
    <circle cx="250" cy="490" r="38" fill="#FFFFFF" stroke="#13838F" stroke-width="2"/>
    <text x="250" y="486" text-anchor="middle" class="b" font-weight="700">Hub C</text><text x="250" y="500" text-anchor="middle" class="s">balanced</text>
    <circle cx="420" cy="440" r="38" fill="#FFFFFF" stroke="#C8553D" stroke-width="2"/>
    <text x="420" y="436" text-anchor="middle" class="b" font-weight="700">Hub D</text><text x="420" y="450" text-anchor="middle" class="s" fill="#C8553D">&#8722;12 at 19:00</text>
    <line x1="137" y1="398" x2="258" y2="368" stroke="#13838F" stroke-width="3" marker-end="url(#t)"/>
    <text x="130" y="362" class="s" font-weight="700">25 packs, 35 min</text>
    <line x1="138" y1="420" x2="378" y2="440" stroke="#13838F" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#t)"/>
    <text x="196" y="448" class="s">12 packs, 50 min</text>
  </g>
  <rect x="486" y="330" width="156" height="202" rx="8" fill="#FFFFFF" stroke="#13838F"/>
  <text x="498" y="350" class="b" font-weight="700">Decides each hour</text>
  <text x="498" y="368" class="b">how many charged</text>
  <text x="498" y="382" class="b">packs go where,</text>
  <text x="498" y="396" class="b">arriving in time for</text>
  <text x="498" y="410" class="b">the P90 forecast</text>
  <text x="498" y="432" class="b" font-weight="700">Respects</text>
  <text x="498" y="450" class="b">van capacity, travel</text>
  <text x="498" y="464" class="b">time, pack type,</text>
  <text x="498" y="478" class="b">5% reserve per hub</text>
  <text x="498" y="502" class="s">Cross-metro moves are</text>
  <text x="498" y="516" class="s">a weekly planning call</text>

  <!-- LEVEL 3 -->
  <rect x="668" y="270" width="416" height="276" rx="10" fill="#FFF8EC" stroke="#E9A23B"/>
  <text x="684" y="294" class="t">Level 3 &#183; Steer drivers (real time)</text>
  <text x="684" y="312" class="s">Move demand instead of moving energy</text>
  <rect x="690" y="330" width="170" height="92" rx="8" fill="#FFFFFF" stroke="#C8553D"/>
  <text x="702" y="350" class="b" font-weight="700">Hub X &#8212; queue 9 cars</text>
  <text x="702" y="368" class="b">price +10% now</text>
  <text x="702" y="386" class="b">wait 25 min</text>
  <text x="702" y="408" class="s" fill="#C8553D">over capacity</text>
  <rect x="900" y="330" width="170" height="92" rx="8" fill="#FFFFFF" stroke="#13838F"/>
  <text x="912" y="350" class="b" font-weight="700">Hub Y &#8212; 2.4 km away</text>
  <text x="912" y="368" class="b">price &#8722;10% now</text>
  <text x="912" y="386" class="b">no wait, packs ready</text>
  <text x="912" y="408" class="s" fill="#13838F">spare capacity</text>
  <line x1="862" y1="376" x2="898" y2="376" stroke="#0B2545" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="690" y="446" class="b">App and fleet API show both options. Evidence:</text>
  <text x="690" y="462" class="b">&#8226; Tesla live pricing: average price unchanged,</text>
  <text x="690" y="476" class="b">   less congestion, better load balance</text>
  <text x="690" y="492" class="b">&#8226; Shenzhen study: 89% of demand lost to a local</text>
  <text x="690" y="506" class="b">   price rise moved to stations within ~3.5 km</text>
  <text x="690" y="530" class="b" font-weight="700" fill="#8A5A12">If the neighbour is ours, a queue becomes a sale.</text>
</svg>
