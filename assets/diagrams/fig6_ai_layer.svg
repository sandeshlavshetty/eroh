<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <style>
    .h{font-size:16px;font-weight:700;fill:#FFFFFF}
    .t{font-size:12.5px;font-weight:700;fill:#3E3266}
    .b{font-size:10.8px;fill:#1E2B37}
    .s{font-size:10px;fill:#4A4466}
    .w{font-size:11px;font-weight:700;fill:#FFFFFF}
    .tool{fill:#FFFFFF;stroke:#5B4B8A;stroke-width:1.2}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3E3266"/></marker>
  </defs>
  <rect width="1100" height="520" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1100" height="44" fill="#3E3266"/>
  <text x="24" y="28" class="h">Modern AI layer &#183; Grid Desk Copilot = LLM agent + MCP tools + RAG, inside a safety harness</text>

  <!-- users -->
  <rect x="16" y="64" width="170" height="210" rx="10" fill="#F2F5F8" stroke="#C9D3DD"/>
  <text x="30" y="88" class="t" fill="#0B2545">People</text>
  <text x="30" y="110" class="b" font-weight="700">Power trader</text>
  <text x="30" y="124" class="s">"Why are we buying 40 MWh</text>
  <text x="30" y="137" class="s">at 18:00 for Delhi?"</text>
  <text x="30" y="160" class="b" font-weight="700">Ops manager</text>
  <text x="30" y="174" class="s">"What if the Chennai wind</text>
  <text x="30" y="187" class="s">farm is 50% down tomorrow?"</text>
  <text x="30" y="210" class="b" font-weight="700">Finance / compliance</text>
  <text x="30" y="224" class="s">"Does this plan break the</text>
  <text x="30" y="237" class="s">banking rule in Karnataka?"</text>
  <line x1="186" y1="170" x2="226" y2="170" stroke="#3E3266" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>

  <!-- harness -->
  <rect x="228" y="58" width="420" height="300" rx="12" fill="#F7F4FF" stroke="#5B4B8A" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="244" y="80" class="t">Agent harness (the safety shell around the LLM)</text>
  <rect x="246" y="94" width="384" height="66" rx="8" fill="#3E3266"/>
  <text x="262" y="116" class="w">LLM agent (GPT / Claude / Llama class, swappable)</text>
  <text x="262" y="134" font-size="10.5" fill="#DCD6F5">plans which tools to call, writes answers with citations</text>
  <text x="262" y="149" font-size="10.5" fill="#DCD6F5">and numbers taken only from tool outputs</text>
  <g>
    <rect x="246" y="172" width="186" height="78" rx="8" fill="#FFFFFF" stroke="#5B4B8A"/>
    <text x="258" y="192" class="b" font-weight="700">Policy + permissions</text>
    <text x="258" y="208" class="s">read-only on live assets;</text>
    <text x="258" y="221" class="s">what-if runs in a sandbox copy;</text>
    <text x="258" y="234" class="s">no tool can submit a bid</text>
    <rect x="444" y="172" width="186" height="78" rx="8" fill="#FFFFFF" stroke="#5B4B8A"/>
    <text x="456" y="192" class="b" font-weight="700">Eval harness</text>
    <text x="456" y="208" class="s">200 golden questions with known</text>
    <text x="456" y="221" class="s">answers, run on every prompt or</text>
    <text x="456" y="234" class="s">model change; must pass to ship</text>
    <rect x="246" y="262" width="186" height="80" rx="8" fill="#FFFFFF" stroke="#5B4B8A"/>
    <text x="258" y="282" class="b" font-weight="700">Grounding checks</text>
    <text x="258" y="298" class="s">every number must match a tool</text>
    <text x="258" y="311" class="s">result; every rule claim must</text>
    <text x="258" y="324" class="s">cite a retrieved clause</text>
    <rect x="444" y="262" width="186" height="80" rx="8" fill="#FFFFFF" stroke="#5B4B8A"/>
    <text x="456" y="282" class="b" font-weight="700">Audit log + human gate</text>
    <text x="456" y="298" class="s">full trace of prompts, tool calls,</text>
    <text x="456" y="311" class="s">sources; trader signs off any</text>
    <text x="456" y="324" class="s">action that changes the plan</text>
  </g>
  <line x1="648" y1="200" x2="688" y2="200" stroke="#3E3266" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>

  <!-- MCP server -->
  <rect x="690" y="58" width="394" height="300" rx="12" fill="#EEF6F7" stroke="#13838F" stroke-width="1.4"/>
  <text x="706" y="80" class="t" fill="#0E5E66">MCP server = typed tools over our existing system</text>
  <g>
    <rect x="706" y="94" width="178" height="46" rx="6" class="tool"/>
    <text x="716" y="112" class="b" font-weight="700">get_forecast()</text><text x="716" y="127" class="s">P1&#8211;P3 quantiles, any cluster</text>
    <rect x="894" y="94" width="178" height="46" rx="6" class="tool"/>
    <text x="904" y="112" class="b" font-weight="700">get_plan()</text><text x="904" y="127" class="s">bids, dispatch, prices, reserve</text>
    <rect x="706" y="150" width="178" height="46" rx="6" class="tool"/>
    <text x="716" y="168" class="b" font-weight="700">explain_decision()</text><text x="716" y="183" class="s">binding constraints, shadow prices</text>
    <rect x="894" y="150" width="178" height="46" rx="6" class="tool"/>
    <text x="904" y="168" class="b" font-weight="700">run_what_if()</text><text x="904" y="183" class="s">re-solve MILP on a sandbox copy</text>
    <rect x="706" y="206" width="178" height="46" rx="6" class="tool"/>
    <text x="716" y="224" class="b" font-weight="700">search_rules()</text><text x="716" y="239" class="s">RAG over regulations + contracts</text>
    <rect x="894" y="206" width="178" height="46" rx="6" class="tool"/>
    <text x="904" y="224" class="b" font-weight="700">get_kpis()</text><text x="904" y="239" class="s">reliability, loss, EBITDA by cluster</text>
  </g>
  <rect x="706" y="266" width="366" height="80" rx="8" fill="#0E5E66"/>
  <text x="720" y="286" class="w">RAG index (hybrid keyword + vector search)</text>
  <text x="720" y="303" font-size="10.5" fill="#D6F0F2">CERC DSM regulations &#183; IEX bye-laws &#183; Green Energy Open Access</text>
  <text x="720" y="317" font-size="10.5" fill="#D6F0F2">Rules + state banking orders &#183; MoP EV guidelines 2024 &#183; PPAs &#183;</text>
  <text x="720" y="331" font-size="10.5" fill="#D6F0F2">fleet contracts &#183; incident reports &#183; past daily bid notes</text>

  <!-- bottom: what it does -->
  <rect x="16" y="372" width="1068" height="134" rx="10" fill="#FFF8EC" stroke="#E9A23B"/>
  <text x="32" y="394" class="t" fill="#8A5A12">What it adds to our framework (and what it never does)</text>
  <text x="32" y="416" class="b" font-weight="700">1. Daily bid note</text>
  <text x="32" y="430" class="s">drafts a one-page explanation of tomorrow's</text>
  <text x="32" y="443" class="s">bids, risks and binding constraints for review</text>
  <text x="300" y="416" class="b" font-weight="700">2. What-if in plain language</text>
  <text x="300" y="430" class="s">"heatwave in Delhi + wind lull in Chennai" &#8594;</text>
  <text x="300" y="443" class="s">builds the scenario, re-solves, compares plans</text>
  <text x="570" y="416" class="b" font-weight="700">3. Compliance check</text>
  <text x="570" y="430" class="s">checks the plan against retrieved clauses</text>
  <text x="570" y="443" class="s">(banking limits, DSM bands, price display)</text>
  <text x="830" y="416" class="b" font-weight="700">4. Incident explainer</text>
  <text x="830" y="430" class="s">"why did Hub B stock out at 19:00?" &#8594;</text>
  <text x="830" y="443" class="s">pulls logs, forecasts, plan, root cause</text>
  <line x1="32" y1="458" x2="1068" y2="458" stroke="#E9A23B" stroke-dasharray="3 3"/>
  <text x="32" y="478" class="b" font-weight="700" fill="#C8553D">Never:</text>
  <text x="84" y="478" class="b">the LLM does not forecast, optimise or control assets. The MILP stays the decision maker; the copilot explains, checks and speeds up</text>
  <text x="84" y="494" class="b">humans. If the copilot is down, nothing in the energy loop changes.</text>
</svg>
